[project]
name = "sata-speedup"
version = "0.1.0"
description = "ComfyUI Taylor attention custom node"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "comfy_kitchen",
  "comet-ml",
  "dreamsim",
  "einops",
  "hpsv2",
  "psutil",
  "pyiqa>=0.1.11",
  "timm>=0.9.16",
  "pillow",
  "torch",
  "numpy",
]

[project.optional-dependencies]
test = [
  "pytest",
]
imagereward = [
  "image-reward==1.5",
  "timm==0.6.13",
]

[tool.pytest.ini_options]
addopts = "-q --ignore=__init__.py"
